name: PLAC MVP CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Testes Unitários do Backend (Python & Django)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências do Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Executar Testes Unitários do Motor de Priorização
        working-directory: ./backend
        run: |
          python -m unittest demands.test_priority

  frontend-build:
    name: Validação de Build do Frontend (React & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Instalar dependências do Frontend
        working-directory: ./frontend
        run: npm install

      - name: Executar Build do Vite
        working-directory: ./frontend
        run: npm run build

  docker-lint:
    name: Validação dos Contêineres Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar sintaxe do Docker Compose
        run: docker compose config
