version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: plac_db
      POSTGRES_USER: plac_user
      POSTGRES_PASSWORD: plac_password
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plac_user -d plac_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8085:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=plac_db
      - DB_USER=plac_user
      - DB_PASS=plac_password
    networks:
      - default
      - pncp_network

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3030:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8085/api
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  default:
  pncp_network:
    external: true
    name: pncp_link_default
